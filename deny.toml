# Supply-chain policy for every crate in Cargo.lock: known advisories, licenses, banned or duplicated crates, and where crates come from. Run with `node scripts/gate.mjs deny`.

[graph]
# The platforms Wirecatch ships on. Crates only used elsewhere (macOS, Android) are not part of any build.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Unmaintained crates fail only when we depend on them directly; deeper ones are reported for upstream to fix.
unmaintained = "workspace"
ignore = [
  # rsa "Marvin" timing side channel. It concerns operations with an RSA private key (decryption and signing). Wirecatch only verifies yt-dlp's release signature with its public key (the pgp crate pulls in rsa for that), so no private key ever exists in the process. Revisit if rsa ships a fix or if Wirecatch ever handles private keys.
  { id = "RUSTSEC-2023-0071", reason = "Wirecatch never holds an RSA private key; only signature verification is used" },
  # crypto-bigint 0.5 timing variability in operations meant to be constant-time, which can leak secret values. pgp 0.21, the latest, pulls it in through its elliptic-curve keys, and the fix (0.7.6) needs a pgp that moves to it. As above, Wirecatch only verifies a public signature: no secret value goes through these operations. Revisit when pgp moves to crypto-bigint 0.7.
  { id = "RUSTSEC-2026-0387", reason = "Wirecatch never holds a secret key; only signature verification with public keys is used" },
]

[licenses]
# Every license here is compatible with distributing Wirecatch under GPL-3.0-only. Adding one needs a check that it is.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
# Tauri brings several windows-sys and windows versions; duplicates are listed, not failed, until upstream converges.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace are fine without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
