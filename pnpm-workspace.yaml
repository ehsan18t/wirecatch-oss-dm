packages:
  - "apps/*"
  - "packages/*"

# One version of each shared tool for every package. Packages refer to these as `catalog:`.
catalog:
  "@eslint-community/eslint-plugin-eslint-comments": 4.8.1
  "@eslint/js": 10.0.1
  "@iconify-json/lucide": 1.2.142
  "@sveltejs/vite-plugin-svelte": 7.3.1
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@testing-library/svelte": 5.4.2
  "@testing-library/user-event": 14.6.7
  "@types/node": 24.19.2
  axe-core: 4.14.0
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-svelte: 3.23.1
  globals: 17.13.0
  jsdom: 30.1.2
  lightningcss: 1.33.0
  prettier: 3.9.10
  prettier-plugin-svelte: 4.1.1
  smol-toml: 1.9.0
  svelte: 5.57.2
  svelte-check: 4.7.6
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  unplugin-icons: 24.0.0
  vite: 8.3.4
  vitest: 5.0.3

# Security floors for transitive dependencies; remove one when its parent requires the fixed version itself.
overrides:
  # GHSA-pqg4-j6r4-53mv: command injection in quote(), reached through web-ext.
  "shell-quote@>=1.8.4 <1.11.0": ">=1.11.0"

auditConfig:
  ignoreGhsas:
    # node-forge, no fixed release: reached only through web-ext's Android support, which the Firefox signing script never uses.
    - GHSA-86w9-cpqp-85rv

# Packages allowed to run install scripts.
allowBuilds:
  esbuild: true
