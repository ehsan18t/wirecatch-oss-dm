packages:
  - "apps/*"
  - "packages/*"

# One version of each shared tool for every package. Packages refer to these as `catalog:`.
catalog:
  "@eslint-community/eslint-plugin-eslint-comments": 4.8.1
  "@eslint/js": 10.0.1
  "@iconify-json/lucide": 1.2.147
  "@playwright/test": 1.64.1
  "@sveltejs/vite-plugin-svelte": 7.3.1
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@testing-library/svelte": 5.4.2
  "@testing-library/user-event": 14.6.8
  "@vitest/eslint-plugin": 1.6.27
  "@types/node": 24.19.2
  axe-core: 4.14.0
  eslint: 10.13.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-de-morgan: 2.2.0
  eslint-plugin-import-x: 4.17.1
  eslint-plugin-regexp: 3.3.1
  eslint-plugin-svelte: 3.23.1
  eslint-plugin-unicorn: 77.0.0
  globals: 17.13.0
  jsdom: 30.1.3
  lightningcss: 1.33.0
  prettier: 3.9.10
  prettier-plugin-svelte: 4.1.1
  smol-toml: 1.9.1
  svelte: 5.57.2
  svelte-check: 4.7.7
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  unplugin-icons: 24.0.0
  vite: 8.3.5
  vitest: 5.0.5

# Security floors for transitive dependencies; remove one when its parent requires the fixed version itself.
overrides:
  # GHSA-pqg4-j6r4-53mv: command injection in quote(), reached through web-ext.
  "shell-quote@>=1.8.4 <1.11.0": ">=1.11.0"

auditConfig:
  ignoreGhsas:
    # node-forge, no fixed release: reached only through web-ext's Android support, which the Firefox signing script never uses.
    - GHSA-86w9-cpqp-85rv

# Packages allowed to run install scripts, and those refused one.
allowBuilds:
  esbuild: true
  # eslint-plugin-import-x's resolver: its script only checks that the prebuilt binding for this system, an optional dependency pnpm already installs, is there.
  unrs-resolver: false
