[workspace]
resolver = "3"
# New crates under crates/ join automatically. The desktop app's Rust side is listed explicitly.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Wirecatch contributors"]
repository = "https://github.com/ehsan18t/wirecatch-oss-dm"
homepage = "https://TODO-PRODUCT-WEBSITE.invalid/"

[workspace.dependencies]
wirecatch-engine = { path = "crates/engine", version = "0.1.0" }
wirecatch-protocol = { path = "crates/protocol", version = "0.1.0" }
wirecatch-queues = { path = "crates/queues", version = "0.1.0" }
wirecatch-core = { path = "crates/core", version = "0.1.0" }
wirecatch-addons = { path = "crates/addons", version = "0.1.0" }
wirecatch-files = { path = "crates/files", version = "0.1.0" }
wirecatch-messages = { path = "crates/messages", version = "0.1.0" }
wirecatch-media = { path = "crates/media", version = "0.1.0" }
wirecatch-records = { path = "crates/records", version = "0.1.0" }
wirecatch-store = { path = "crates/store", version = "0.1.0" }
wirecatch-server = { path = "crates/server", version = "0.1.0" }
wirecatch-settings = { path = "crates/settings", version = "0.1.0" }
wirecatch-sites = { path = "crates/sites", version = "0.1.0" }
wirecatch-ipc = { path = "crates/ipc", version = "0.1.0" }
wirecatch-streams = { path = "crates/streams", version = "0.1.0" }
wirecatch-product = { path = "crates/product", version = "0.1.0" }
wirecatch-shell = { path = "crates/shell", version = "0.1.0" }
wirecatch-updates = { path = "crates/updates", version = "0.1.0" }
wirecatch-logging = { path = "crates/logging", version = "0.1.0", default-features = false }
ts-rs = { version = "12", features = ["serde-compat"] }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getrandom = { version = "0.4", features = ["std"] }
indicatif = "0.18.6"
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
regex = "1"
# Only the naive date and time types; core turns on the clock.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tempfile = "3.27.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }
axum = "0.8"

# Every crate opts in with `[lints] workspace = true`; the gate's lint-policy check fails for one that does not. Levels are `warn` so local builds keep going while you work; the gate (`cargo clippy ... -- -D warnings`) turns every one into an error. An exception is written in place as `#[expect(lint, reason = "...")]`, never `allow`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A doc comment is written where it says what the signature cannot, never to satisfy a lint (D76).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Selected `restriction` lints.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Debug and test builds keep file and line for this workspace's code, so backtraces and panics still point at the line, and no debug info for dependencies (D33). For a debugger session, set CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Running the GPUI app (`cargo ui`): unoptimised, GPUI takes about 20 ms a frame while a dialog animates, below the display's rate. Its own profile, so the dev builds of checks and tests stay unoptimised and quick to compile.
[profile.ui]
inherits = "dev"

[profile.ui.package.gpui-pre]
opt-level = 3

[profile.ui.package.gpui-pre-windows]
opt-level = 3

[profile.ui.package.gpui-pre-linux]
opt-level = 3

[profile.ui.package.gpui-pre-wgpu]
opt-level = 3

[profile.ui.package.gpui-pre-sum-tree]
opt-level = 3

[profile.ui.package.gpui-base]
opt-level = 3

[profile.ui.package.gpui-component]
opt-level = 3

[profile.ui.package.taffy]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
