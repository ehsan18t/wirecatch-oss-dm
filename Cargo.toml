[workspace]
resolver = "3"
# New crates under crates/ join automatically.
members = ["crates/*"]
exclude = [
    ".cache/rust-backports/accesskit_windows-0.34.0-4655ca3d5e64bb26",
    ".cache/rust-backports/gpui-pre-windows-0.3.14-020ecd753c6b6f88",
]

[patch.crates-io]
# Prepared from pinned crates.io archives by scripts/prepare-rust-backports.mjs.
# Return a UI Automation error when a provider is queried after its HWND closes.
accesskit_windows = { path = ".cache/rust-backports/accesskit_windows-0.34.0-4655ca3d5e64bb26" }
# Backport the Windows activation callback fix to the snapshot gpui-kit pins.
gpui-pre-windows = { path = ".cache/rust-backports/gpui-pre-windows-0.3.14-020ecd753c6b6f88" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Wirecatch contributors"]
repository = "https://github.com/ehsan18t/wirecatch-oss-dm"
homepage = "https://TODO-PRODUCT-WEBSITE.invalid/"

[workspace.dependencies]
wirecatch-engine = { path = "crates/engine", version = "0.1.0" }
wirecatch-protocol = { path = "crates/protocol", version = "0.1.0" }
wirecatch-queues = { path = "crates/queues", version = "0.1.0" }
wirecatch-core = { path = "crates/core", version = "0.1.0" }
wirecatch-addons = { path = "crates/addons", version = "0.1.0" }
wirecatch-files = { path = "crates/files", version = "0.1.0" }
wirecatch-messages = { path = "crates/messages", version = "0.1.0" }
wirecatch-media = { path = "crates/media", version = "0.1.0" }
wirecatch-media-formats = { path = "crates/media-formats", version = "0.1.0" }
wirecatch-records = { path = "crates/records", version = "0.1.0" }
wirecatch-store = { path = "crates/store", version = "0.1.0" }
wirecatch-server = { path = "crates/server", version = "0.1.0" }
wirecatch-settings = { path = "crates/settings", version = "0.1.0" }
wirecatch-sites = { path = "crates/sites", version = "0.1.0" }
wirecatch-ipc = { path = "crates/ipc", version = "0.1.0" }
wirecatch-streams = { path = "crates/streams", version = "0.1.0" }
wirecatch-product = { path = "crates/product", version = "0.1.0" }
wirecatch-shell = { path = "crates/shell", version = "0.1.0" }
wirecatch-updates = { path = "crates/updates", version = "0.1.0" }
wirecatch-logging = { path = "crates/logging", version = "0.1.0", default-features = false }
ts-rs = { version = "12", features = ["serde-compat"] }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getrandom = { version = "0.4", features = ["std"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
http = "1.1.0"
rustls = { version = "0.23.4", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8.0"
tokio-rustls = { version = "0.26.0", default-features = false, features = ["ring", "tls12"] }
webpki-root-certs = "1.0.11"
indicatif = "0.18.6"
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", default-features = false }
url = "2"
regex = "1"
# Civil dates and times only; crates that read the local clock add the system time zone.
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
tempfile = "3.27.0"
trash = "5.3.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
windows-sys = "0.61.2"
axum = "0.8"
dirs = "7.0.0"
ed25519-dalek = { version = "2.2.0", default-features = false }
h3 = "0.0.8"
h3-quinn = "0.0.10"
hyper = { version = "1.4.0", default-features = false }
hyper-util = { version = "0.1.12", default-features = false }
lzma-rust2 = { version = "0.23.0", default-features = false }
pgp = { version = "0.21.0", default-features = false }
quinn = { version = "0.11.9", default-features = false }
rand = "0.8.6"
rcgen = { version = "0.14.0", default-features = false }
sha2 = "0.10.9"
tar = { version = "0.4.44", default-features = false }
windows-registry = "0.6.1"
zip = { version = "9.0.5", default-features = false }

# Every crate opts in with `[lints] workspace = true`; the gate's lint-policy check fails for one that does not. Levels are `warn` so local builds keep going while you work; the gate (`cargo clippy ... -- -D warnings`) turns every one into an error. An exception is written in place as `#[expect(lint, reason = "...")]`, never `allow`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A doc comment is written where it says what the signature cannot, never to satisfy a lint (D76).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Selected `restriction` lints.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Debug and test builds keep file and line for this workspace's code, so backtraces and panics still point at the line, and no debug info for dependencies (D33). For a debugger session, set CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Running the GPUI app (`cargo ui`): unoptimised, GPUI takes about 20 ms a frame while a dialog animates, below the display's rate. Its own profile, so the dev builds of checks and tests stay unoptimised and quick to compile.
[profile.ui]
inherits = "dev"

[profile.ui.package.gpui-pre]
opt-level = 3

[profile.ui.package.gpui-pre-windows]
opt-level = 3

[profile.ui.package.gpui-pre-linux]
opt-level = 3

[profile.ui.package.gpui-pre-wgpu]
opt-level = 3

[profile.ui.package.gpui-pre-sum-tree]
opt-level = 3

[profile.ui.package.gpui-base]
opt-level = 3

[profile.ui.package.gpui-component]
opt-level = 3

[profile.ui.package.taffy]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
