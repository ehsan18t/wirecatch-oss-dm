[workspace]
resolver = "3"
# New crates under crates/ join automatically. The desktop app's Rust side is listed explicitly.
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
wirecatch-engine = { path = "crates/engine", version = "0.1.0" }
wirecatch-protocol = { path = "crates/protocol", version = "0.1.0" }
wirecatch-core = { path = "crates/core", version = "0.1.0" }
wirecatch-ipc = { path = "crates/ipc", version = "0.1.0" }
wirecatch-streams = { path = "crates/streams", version = "0.1.0" }
ts-rs = { version = "11", features = ["serde-compat"] }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
indicatif = "0.17"
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
tempfile = "3.27.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }
axum = "0.8"

# Every crate opts in with `[lints] workspace = true`; the gate's lint-policy check fails for one that does not. Levels are `warn` so local builds keep going while you work; the gate (`cargo clippy ... -- -D warnings`) turns every one into an error. An exception is written in place as `#[expect(lint, reason = "...")]`, never `allow`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Selected `restriction` lints.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
