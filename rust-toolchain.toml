# The Rust release every developer, script and CI job uses: always the latest stable (D56). CI installs it on every run; locally, `rustup update` brings it up to date.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
# The Linux standard library, so the gate can lint for Linux from Windows and macOS (clippy-linux). It is only the library; no C toolchain comes with it.
targets = ["x86_64-unknown-linux-gnu"]
profile = "minimal"
