# The Rust release every developer, script and CI job uses. Raise it on purpose, together with any fixes the new lints need.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
# The Linux standard library, so the gate can lint for Linux from Windows and macOS (clippy-linux). It is only the library; no C toolchain comes with it.
targets = ["x86_64-unknown-linux-gnu"]
profile = "minimal"
