[package]
name = "wirecatch-core"
description = "Download manager for Wirecatch: queues, scheduling, persistence, settings and the local protocol server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
wirecatch-engine.workspace = true
wirecatch-protocol = { workspace = true, features = ["tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["io-util", "test-util"] }
tracing-subscriber.workspace = true
