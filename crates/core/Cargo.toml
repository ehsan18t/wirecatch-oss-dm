[package]
name = "wirecatch-core"
description = "Download manager for Wirecatch: queues, scheduling, and running downloads and media downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
wirecatch-addons.workspace = true
wirecatch-engine.workspace = true
wirecatch-files.workspace = true
wirecatch-logging.workspace = true
wirecatch-media.workspace = true
wirecatch-messages.workspace = true
wirecatch-product.workspace = true
wirecatch-protocol = { workspace = true, features = ["tokio"] }
wirecatch-queues.workspace = true
wirecatch-records.workspace = true
wirecatch-settings.workspace = true
wirecatch-sites.workspace = true
wirecatch-store.workspace = true
wirecatch-streams.workspace = true
chrono = { workspace = true, features = ["clock"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true

# Stands in for the media add-on's programs in this crate's tests, which take its path from
# `CARGO_BIN_EXE_fake_media_tool`, so cargo builds it for every test run.
sha2 = "0.10.9"
[[bin]]
name = "fake_media_tool"
path = "src/bin/fake_media_tool.rs"
test = false
doc = false

[dev-dependencies]
anyhow.workspace = true
# Building the media add-on releases the manager tests install: .zip and signed .tar.xz.
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "encoder"] }
pgp = { version = "0.21.0", default-features = false }
rand = "0.8.6"
rusqlite.workspace = true
tar = { version = "0.4.44", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
# Logging for the headless example.
wirecatch-logging = { workspace = true, features = ["setup"] }
wirecatch-files = { workspace = true, features = ["testing"] }
wirecatch-server.workspace = true
wirecatch-sites = { workspace = true, features = ["testing"] }
wirecatch-test-support = { path = "../test-support", features = ["servers", "resume"] }

[lints]
workspace = true
