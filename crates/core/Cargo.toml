[package]
name = "wirecatch-core"
description = "Download manager for Wirecatch: queues, scheduling, persistence, settings and the local protocol server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
wirecatch-engine.workspace = true
wirecatch-protocol = { workspace = true, features = ["tokio"] }
wirecatch-streams = { path = "../streams", version = "0.1.0" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
# Reading the media add-on's archives: .xz (pure Rust) inside .tar, and .zip.
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "xz", "optimization"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# Checking the media add-on against its published SHA-256 checksums.
sha2 = "0.10.9"
tar = { version = "0.4.44", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow.workspace = true
# Writing .tar.xz archives for the add-on tests.
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "xz", "encoder"] }
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["io-util", "test-util"] }
tracing-subscriber.workspace = true
