[package]
name = "wirecatch-core"
description = "Download manager for Wirecatch: queues, scheduling, persistence, settings and the local protocol server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
wirecatch-engine.workspace = true
wirecatch-files.workspace = true
wirecatch-logging.workspace = true
wirecatch-product.workspace = true
wirecatch-protocol = { workspace = true, features = ["tokio"] }
wirecatch-queues.workspace = true
wirecatch-sites.workspace = true
wirecatch-streams.workspace = true
chrono = { workspace = true, features = ["clock"] }
dirs = "7.0.0"
# Reading the media add-on's archives: .xz (pure Rust) inside .tar, and .zip.
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "optimization"] }
# The user name in a proxy address the computer sets (Copy from system, D71).
percent-encoding.workspace = true
# Checking yt-dlp's OpenPGP signature on its checksum list (D21.1), verification
# only: no compression (signatures are detached), no extra algorithms.
pgp = { version = "0.21.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# Checking the media add-on against its published SHA-256 checksums.
sha2 = "0.10.9"
tar = { version = "0.4.44", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
anyhow.workspace = true
# Writing .tar.xz archives for the add-on tests.
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "encoder"] }
# Making throwaway signing keys for the signature tests (the version pgp uses).
rand = "0.8.6"
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
# Logging for the headless example.
wirecatch-logging = { workspace = true, features = ["setup"] }
wirecatch-files = { workspace = true, features = ["testing"] }
wirecatch-server.workspace = true
wirecatch-sites = { workspace = true, features = ["testing"] }
wirecatch-test-support = { path = "../test-support", features = ["servers", "resume"] }

[lints]
workspace = true
