[package]
name = "wirecatch-core"
description = "Download manager for Wirecatch: queues, scheduling, persistence, settings and the local protocol server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
wirecatch-engine.workspace = true
wirecatch-logging.workspace = true
wirecatch-product.workspace = true
wirecatch-protocol = { workspace = true, features = ["tokio"] }
wirecatch-streams.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
# Reading the media add-on's archives: .xz (pure Rust) inside .tar, and .zip.
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "xz", "optimization"] }
# Checking yt-dlp's OpenPGP signature on its checksum list (D21.1), verification
# only: no compression (signatures are detached), no extra algorithms.
pgp = { version = "0.21.0", default-features = false }
# Reading the Public Suffix List, the snapshot built in and the newer ones the
# app downloads, both its sections: which names are open to anyone's
# registration (D39, D44). Its default feature adds each rule's ASCII form.
publicsuffix = "2.3.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# Checking the media add-on against its published SHA-256 checksums.
sha2 = "0.10.9"
tar = { version = "0.4.44", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow.workspace = true
# Writing .tar.xz archives for the add-on tests.
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "xz", "encoder"] }
# Making throwaway signing keys for the signature tests (the version pgp uses).
rand = "0.8.6"
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
# Logging for the headless example.
wirecatch-logging = { workspace = true, features = ["setup"] }
wirecatch-test-support = { path = "../test-support", features = ["servers"] }

[lints]
workspace = true
