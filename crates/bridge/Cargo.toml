[package]
name = "wirecatch-bridge"
description = "Native messaging host that connects the Wirecatch browser extension to the Wirecatch app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "wirecatch-bridge"
path = "src/main.rs"

[features]
## Test-only environment overrides for the app endpoint and the app launcher
## (see `src/app.rs`). Never enable this in a build that ships. Which extensions
## the bridge trusts never depends on a feature (D22).
test-overrides = []

[dependencies]
wirecatch-ipc.workspace = true
wirecatch-logging = { workspace = true, features = ["setup"] }
wirecatch-protocol = { workspace = true, features = ["tokio"] }
wirecatch-product.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "io-util", "macros"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "sync", "io-util", "macros", "process", "test-util"] }
# The plain helpers only, without the test servers' TLS stack.
wirecatch-test-support = { path = "../test-support" }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints]
workspace = true
