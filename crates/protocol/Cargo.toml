[package]
name = "wirecatch-protocol"
description = "Message and data types shared by the Wirecatch app, bridge and browser extension"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Only the engine is published to crates.io.
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
url.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }

[features]
## Async frame reading and writing for tokio streams.
tokio = ["dep:tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "rt", "macros"] }
# The cases of the secret rules, shared with their TypeScript port.
wirecatch-test-support = { path = "../test-support", features = ["redaction"] }

[lints]
workspace = true
