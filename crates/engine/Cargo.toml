[package]
name = "wirecatch-engine"
description = "Fast, resumable HTTP(S) and FTP(S) download engine: parallel connections, dynamic splitting, positional writes and crash-safe resume"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# The oldest Rust this published crate builds with; CI checks it (the msrv job). Other crates build with rust-toolchain.toml only.
rust-version = "1.88"
readme = "README.md"
keywords = ["download", "downloader", "http", "ftp", "resume"]
categories = ["network-programming", "web-programming::http-client", "asynchronous"]
# The package is the library only. The tests and examples use the unpublished
# wirecatch-test-support crate, so they could not build from the package; they
# run in the workspace instead. The gate checks the list (engine-package).
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
bytes.workspace = true
# Only the portable engine: the default SIMD engines are unsafe code with nothing
# to gain on a header's worth of text.
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
httpdate = "1.0.3"
# Only for the proxy matcher the HTTP client itself uses (see src/proxy.rs), so
# the engine reads NO_PROXY exactly as reqwest does; reqwest already builds it.
hyper-util = { version = "0.1.12", default-features = false, features = ["client-proxy"] }
percent-encoding.workspace = true
# Only the HTTP client: TLS comes preconfigured from the rustls dependency below,
# so reqwest needs no crypto provider. The platform verifier its rustls feature
# brings is built but never used; reqwest has no rustls feature without it.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "socks"] }
# The rustls reqwest uses, so the shared TLS configuration is the exact type it
# accepts; ring is the engine's own choice of crypto provider.
rustls = { version = "0.23.4", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
# TLS on FTP connections. reqwest already builds it (through hyper-rustls), so
# FTPS adds no new crate to the build.
tokio-rustls = { version = "0.26.0", default-features = false, features = ["ring", "tls12"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

# HTTP/3, only with the `http3` feature.
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = "1.1.0"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }

[features]
default = []
# Experimental HTTP/3 support, see `DownloadOptions::http3`. Off by default to
# keep the default build lean (it adds 18 crates, quinn and h3 among them).
# It also turns on the HTTP/3 test servers for the engine's own tests; that
# part is dropped from the published manifest with the test-support dependency.
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn", "wirecatch-test-support/http3"]

# docs.rs documents the http3 API too; the gate builds the docs the same way (engine-docs).
[package.metadata.docs.rs]
all-features = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
# The system's proxy setting (src/proxy.rs); the version the HTTP client's own reader uses.
windows-registry = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
# The shared test servers. A path dependency without a version, so publishing
# leaves it out (it is never published).
wirecatch-test-support = { path = "../test-support", features = ["servers", "logs", "resume"] }
tokio = { workspace = true, features = ["test-util", "io-util"] }
bytes.workspace = true
proptest = { version = "1.6.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dev-dependencies]
# Process CPU time in the HTTP/3 benchmark.
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[[example]]
name = "bench_http3"
required-features = ["http3"]

[lints]
workspace = true
