[package]
name = "wirecatch-engine"
description = "Fast, resumable HTTP(S) download engine: parallel connections, dynamic splitting, positional writes and crash-safe resume"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/wirecatch-engine"
keywords = ["download", "downloader", "http", "resume", "segmented"]
categories = ["network-programming", "web-programming::http-client", "asynchronous"]
# `repository` and `homepage` are added once the public GitHub organization exists.

[dependencies]
bytes.workspace = true
futures-util.workspace = true
httpdate = "1.0.3"
percent-encoding.workspace = true
reqwest.workspace = true
# Same major version and crypto provider (ring) as reqwest uses, so the shared
# TLS configuration is the exact type reqwest accepts.
rustls = { version = "0.23.4", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }
bytes.workspace = true
futures-util.workspace = true
proptest = { version = "1.6.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.0", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26.0", default-features = false, features = ["ring", "tls12"] }
