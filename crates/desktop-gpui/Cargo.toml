[package]
name = "wirecatch-desktop-gpui"
description = "Wirecatch desktop app on GPUI: hosts the download manager and draws its windows (D95)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
gpui-kit = "0.8.1"
wirecatch-core.workspace = true
wirecatch-engine.workspace = true
wirecatch-queues.workspace = true
wirecatch-shell.workspace = true
wirecatch-sites.workspace = true
wirecatch-ipc.workspace = true
wirecatch-logging = { workspace = true, features = ["setup"] }
wirecatch-product.workspace = true
wirecatch-protocol.workspace = true
dirs = "7.0.0"
chrono = { workspace = true, features = ["clock"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = { workspace = true }
regex.workspace = true
url.workspace = true
png = "0.18.1"
# D-Bus (StatusNotifierItem) on Linux, not GTK: the app runs no GTK loop (D104).
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }

[lints]
workspace = true
