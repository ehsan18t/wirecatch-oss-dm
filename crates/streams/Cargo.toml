[package]
name = "wirecatch-streams"
description = "HLS and DASH video stream downloads for Wirecatch: parallel segments, AES-128, resume, and joining with ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wirecatch-engine.workspace = true
# HLS "METHOD=AES-128" is AES-128 in CBC mode with PKCS#7 padding.
aes = "0.8.4"
cbc = "0.2.1"
# A small, dependency-free XML reader for DASH manifests.
roxmltree = "0.21.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
bytes.workspace = true
cbc = { version = "0.2.1", features = ["alloc"] }
tokio = { workspace = true, features = ["test-util"] }
