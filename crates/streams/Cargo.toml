[package]
name = "wirecatch-streams"
description = "HLS and DASH video stream downloads for Wirecatch: parallel segments, AES-128, resume, and joining with ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Only the engine is published to crates.io.
publish = false

[dependencies]
wirecatch-engine.workspace = true
# HLS "METHOD=AES-128" is AES-128 in CBC mode with PKCS#7 padding.
aes = "0.8.4"
cbc = "0.1.2"
# A small, dependency-free XML reader for DASH manifests.
roxmltree = "0.21.1"
# The codec and container policy is stored with core's downloads.
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum.workspace = true
bytes.workspace = true
cbc = { version = "0.1.2", features = ["alloc"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wirecatch-test-support = { path = "../test-support", features = ["servers", "logs"] }

[lints]
workspace = true
