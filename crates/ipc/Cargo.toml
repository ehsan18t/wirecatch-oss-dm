[package]
name = "wirecatch-ipc"
description = "Per-user local socket transport between the Wirecatch app, bridge and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
# Only the engine is published to crates.io.
publish = false

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
wirecatch-protocol = { workspace = true, features = ["tokio"] }

[lints]
workspace = true
