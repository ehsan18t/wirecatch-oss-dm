[package]
name = "wirecatch-cli"
description = "Command-line interface for the Wirecatch download engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Only the engine is published to crates.io.
publish = false

[[bin]]
name = "wirecatch"
path = "src/main.rs"

[dependencies]
wirecatch-engine.workspace = true
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# Experimental HTTP/3 (`--http3`). Off by default, like the engine's feature.
http3 = ["wirecatch-engine/http3"]

[lints]
workspace = true
