[package]
name = "wirecatch-addons"
description = "The media add-on of Wirecatch: its pinned releases, their checksums and signatures, unpacking them safely, and finding the installed programs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
wirecatch-engine.workspace = true
wirecatch-files.workspace = true
wirecatch-product.workspace = true
# Reading the media add-on's archives: .xz (pure Rust) inside .tar, and .zip.
lzma-rust2 = { workspace = true, features = ["std", "xz", "optimization"] }
# Checking yt-dlp's OpenPGP signature on its checksum list (D21.1), verification
# only: no compression (signatures are detached), no extra algorithms.
pgp.workspace = true
serde.workspace = true
serde_json.workspace = true
# Checking the media add-on against its published SHA-256 checksums.
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tracing.workspace = true
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Writing .tar.xz archives for the tests.
lzma-rust2 = { workspace = true, features = ["std", "xz", "encoder"] }
# Making throwaway signing keys for the signature tests (the version pgp uses).
rand.workspace = true
tempfile.workspace = true

[lints]
workspace = true
