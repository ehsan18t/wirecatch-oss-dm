[package]
name = "wirecatch-addons"
description = "The media add-on of Wirecatch: its pinned releases, their checksums and signatures, unpacking them safely, and finding the installed programs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
wirecatch-engine.workspace = true
wirecatch-files.workspace = true
wirecatch-product.workspace = true
# Reading the media add-on's archives: .xz (pure Rust) inside .tar, and .zip.
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "optimization"] }
# Checking yt-dlp's OpenPGP signature on its checksum list (D21.1), verification
# only: no compression (signatures are detached), no extra algorithms.
pgp = { version = "0.21.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
# Checking the media add-on against its published SHA-256 checksums.
sha2 = "0.10.9"
tar = { version = "0.4.44", default-features = false }
thiserror.workspace = true
tracing.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Writing .tar.xz archives for the tests.
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "encoder"] }
# Making throwaway signing keys for the signature tests (the version pgp uses).
rand = "0.8.6"
tempfile.workspace = true

[lints]
workspace = true
