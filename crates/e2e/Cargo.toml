[package]
name = "wirecatch-e2e"
description = "End-to-end tests: the real browser bridge, the manager and a local HTTP server, driven by a scripted fake extension"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Stands in for `wirecatch-app --background` when the bridge has to start the
# app (the bridge launch test). It runs the manager with no UI on a private test
# endpoint and exits when its first client goes away.
[[bin]]
name = "wirecatch-e2e-app"
path = "src/bin/wirecatch-e2e-app.rs"
test = false

[dependencies]
wirecatch-core.workspace = true
wirecatch-ipc.workspace = true
wirecatch-product.workspace = true
wirecatch-protocol = { workspace = true, features = ["tokio"] }
wirecatch-test-support = { path = "../test-support", features = ["bridge", "servers"] }
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "process"] }

[lints]
workspace = true
