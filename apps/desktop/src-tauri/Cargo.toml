[package]
name = "wirecatch-desktop"
description = "Wirecatch desktop app: the Tauri shell that hosts the download manager and its interface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Desktop only: a plain library the binary links to (no mobile static or dynamic libraries).
[lib]
name = "wirecatch_desktop_lib"

# The bridge starts the app by this name (`wirecatch-app --background`), from its own folder.
[[bin]]
name = "wirecatch-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
# The contract's command names, each of which needs a permission a window is granted (D43).
wirecatch-protocol.workspace = true

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
# Held at 2.6: from 2.7 its auto-launch 0.6 writes the entry for every user when the app runs as
# administrator, which start at sign-in must never do (D25.3), and neither `read_state` nor the
# uninstaller would see it.
tauri-plugin-autostart = "~2.6.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
# Compiled in but only switched on when `plugins.updater` is configured (D19).
# Without `zip`: that feature only unpacks the legacy v1 update archives, and
# `createUpdaterArtifacts: true` publishes the installers themselves.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
wirecatch-core.workspace = true
# Its checked conversions between whole numbers and floating point (`numeric`).
wirecatch-engine.workspace = true
wirecatch-ipc.workspace = true
wirecatch-logging = { workspace = true, features = ["setup"] }
wirecatch-product.workspace = true
wirecatch-protocol = { workspace = true, features = ["tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing = { workspace = true }
url.workspace = true

[target.'cfg(windows)'.dependencies]
# The same version tauri-plugin-autostart uses, to read the start-at-sign-in entry's state, to
# register the app's notification identity, and to read the Windows build (D64).
winreg = "0.10.1"
# The version Tauri already uses, to keep a download window behind the window that took the
# focus from it (D23), and to lay the window that offers the snap layouts over the maximize button (D36).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The version Tauri already uses: the accent colour chosen in Windows, and whether it is set to dark
# apps, for a new window's background (D45).
# And the system's own notifications, with buttons, under the app's identity (D52).
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI",
    "UI_Notifications",
    "UI_ViewManagement",
] }

# The versions Tauri already uses, to put the hidden main window's web view to sleep (D13).
webview2-com = "0.39.1"
windows-core = "0.62.2"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's notification service, with the buttons of a notification (D52); the version
# Tauri's notification plugin used before.
notify-rust = "4.18.2"

[dev-dependencies]
tempfile.workspace = true
# The mock runtime, to test the tray, quitting and event forwarding without a real window.
tauri = { version = "2.12.5", features = ["tray-icon", "test"] }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread", "io-util", "process"] }
wirecatch-test-support = { path = "../../../crates/test-support", features = ["bridge", "servers"] }

[lints]
workspace = true
