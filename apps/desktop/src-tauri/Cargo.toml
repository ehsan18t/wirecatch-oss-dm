[package]
name = "wirecatch-desktop"
description = "Wirecatch desktop app: the Tauri shell that hosts the download manager and its interface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Desktop only: a plain library the binary links to (no mobile static or dynamic libraries).
[lib]
name = "wirecatch_desktop_lib"

# The bridge starts the app by this name (`wirecatch-app --background`), from its own folder.
[[bin]]
name = "wirecatch-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.4.5"
# Compiled in but only switched on when `plugins.updater` is configured (D19).
tauri-plugin-updater = "2.12.0"
wirecatch-core.workspace = true
# Its checked conversions between whole numbers and floating point (`numeric`).
wirecatch-engine.workspace = true
wirecatch-ipc.workspace = true
wirecatch-logging = { workspace = true, features = ["setup"] }
wirecatch-product.workspace = true
wirecatch-protocol = { workspace = true, features = ["tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing = { workspace = true }
url.workspace = true

[target.'cfg(windows)'.dependencies]
# The same version tauri-plugin-autostart uses, to read the start-at-sign-in entry's state.
winreg = "0.10.1"
# The version Tauri already uses, to keep a download window behind the window that took the
# focus from it (D23).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# The versions Tauri already uses, to put the hidden main window's web view to sleep (D13).
webview2-com = "0.39.1"
windows-core = "0.62.2"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
# The mock runtime, to test the tray, quitting and event forwarding without a real window.
tauri = { version = "2.12.3", features = ["tray-icon", "test"] }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread", "io-util", "process"] }
wirecatch-test-support = { path = "../../../crates/test-support", features = ["servers"] }

[lints]
workspace = true
