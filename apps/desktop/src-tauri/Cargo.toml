[package]
name = "wirecatch-desktop"
description = "Wirecatch desktop app: the Tauri shell that hosts the download manager and its interface."
version.workspace = true
edition.workspace = true
license.workspace = true
# Tauri 2.12 needs Rust 1.90; the published engine keeps the workspace minimum (1.88).
rust-version = "1.90"
publish = false

# Desktop only: a plain library the binary links to (no mobile static or dynamic libraries).
[lib]
name = "wirecatch_desktop_lib"

# The bridge starts the app by this name (`wirecatch-app --background`), from its own folder.
[[bin]]
name = "wirecatch-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.4.5"
# Compiled in but only switched on when `plugins.updater` is configured (D19).
tauri-plugin-updater = "2.12.0"
wirecatch-core = { path = "../../../crates/core" }
wirecatch-ipc = { path = "../../../crates/ipc" }
wirecatch-protocol = { workspace = true, features = ["tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
bytes = { workspace = true }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread", "io-util", "process"] }
