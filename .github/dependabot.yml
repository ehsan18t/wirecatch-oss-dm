# Weekly dependency updates, grouped so each ecosystem opens one pull request
# for its routine updates. Major versions of Cargo and npm packages still come
# one per pull request, since they can need code changes.
#
# Actions stay pinned to commit SHAs: Dependabot moves the SHA and the version
# comment next to it together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # The whole Cargo workspace, including apps/desktop/src-tauri.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # The pnpm workspace (pnpm-lock.yaml at the root covers apps/* and packages/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
