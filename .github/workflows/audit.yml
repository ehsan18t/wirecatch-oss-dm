# Weekly dependency advisory check, so a new advisory against an unchanged Cargo.lock is noticed even when nothing is pushed. Same pinned steps as the audit job in ci.yml.
name: Weekly audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency advisories
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the release named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.0 --locked

      - name: Gate (advisories)
        run: |
          cargo deny --locked check advisories
          node scripts/gate.mjs npm-audit
