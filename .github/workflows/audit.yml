# Weekly advisory check, so a new advisory against unchanged lockfiles is noticed even when nothing is pushed. It runs the advisory part of the gate's supply-chain checks (licenses and bans only change with a push, which ci.yml covers).
name: Weekly audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  audit:
    name: Dependency advisories
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the release named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      # Keeps the installed tools between runs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install gate tools
        run: node scripts/gate.mjs --install-tools

      - name: Rust advisories
        run: cargo deny --locked check advisories

      - name: Gate (npm advisories)
        run: node scripts/gate.mjs npm-audit
