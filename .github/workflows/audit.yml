# Weekly dependency advisory check, so a new advisory against an unchanged Cargo.lock is noticed even when nothing is pushed. Same pinned steps as the audit job in ci.yml.
name: Weekly audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency advisories
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the release named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Cargo.lock
        run: cargo audit
