# Builds what a release ships and drafts the GitHub release with it (XC-20, D111). A version tag (`v1.2.3`, or `v1.2.3-beta.1` for a pre-release) starts it, or a run by hand, which builds without drafting. Every installer is built on x64 and ARM64; the draft carries them with the update manifest, signed with the repository secret UPDATER_PRIVATE_KEY, and waits for the maintainer to read and publish it. The installers themselves are unsigned until a code-signing certificate exists (D19). Drafting runs `node scripts/gate.mjs publish` first, so nothing is drafted while `config/product.toml` holds a placeholder.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The system packages the desktop crate links against, as CI installs them (D55).
      - name: Install system packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh scripts/ci/linux-packages.txt ~/apt-packages

      - name: Install Rust
        run: rustup toolchain install

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pinned Inno Setup, checked against its SHA-256 (D106).
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup does not match its pinned SHA-256.' }
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait

      # Runs `gate.mjs release-build` first, then builds the app, the bridge and the installers.
      - name: Build the installers
        run: node scripts/package.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/packages/*.exe
            target/packages/*.deb
            target/packages/*.rpm
            target/packages/*.AppImage
          if-no-files-found: error

  # Each Linux package installed on a fresh system of its kind: its dependencies cover the app, the app starts and registers the bridge, and removal unregisters it (scripts/ci/linux-package-check.sh).
  linux-packages:
    name: Linux ${{ matrix.kind }}
    needs: desktop
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            image: ubuntu:24.04
          - kind: rpm
            image: fedora:42
          - kind: appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-Linux-X64
          path: packages

      - name: Read the app's name
        id: names
        run: echo "app=$(sed -n 's/^app = "\(.*\)"/\1/p' config/product.toml)" >> "$GITHUB_OUTPUT"

      - name: Check the package
        if: matrix.kind != 'appimage'
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }}
          bash scripts/ci/linux-package-check.sh ${{ matrix.kind }} packages/*.${{ matrix.kind }} ${{ steps.names.outputs.app }}

      - name: Check the AppImage
        if: matrix.kind == 'appimage'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth mesa-vulkan-drivers >/dev/null
          sudo bash scripts/ci/linux-package-check.sh appimage packages/*.AppImage ${{ steps.names.outputs.app }}

  extension:
    name: Extension
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The product check formats the generated Rust it compares with rustfmt.
      - name: Install Rust
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # What a store upload needs on top of the release checks: the bundled Public Suffix List is current.
      - name: Check the extension release
        run: node scripts/gate.mjs release-build-extension

      - name: Build the store packages
        run: pnpm --filter @wirecatch/extension zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: apps/extension/.output/*.zip
          # WXT writes the packages to `.output`, which the action skips as hidden unless told.
          include-hidden-files: true
          if-no-files-found: error

  draft:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, linux-packages, extension]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The product check formats the generated Rust it compares with rustfmt.
      - name: Install Rust
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No identity value may still be a placeholder (D29).
      - name: Check what is published
        run: node scripts/gate.mjs publish

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      # The tag must name the version the installers were built as.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' config/product.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match version $version in config/product.toml."
            exit 1
          fi

      # The manifest the app's updates trust only with this signature (D111).
      - name: Sign the update manifest
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: node scripts/release/manifest.mjs release

      # A tag with a pre-release part (`v1.2.3-beta.1`) drafts a pre-release, which the app offers only to those who ask for one.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}" release/*
