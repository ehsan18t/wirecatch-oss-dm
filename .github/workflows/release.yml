# Builds what a release ships and drafts the GitHub release with it (XC-20, D111, D288). A version tag (`v1.2.3`, or `v1.2.3-beta.1` for a pre-release) starts it, or a run by hand, which builds without drafting. Every installer is built on x64 and ARM64; the draft carries them, in signed update mode with the update manifest, signed by its own job in the protected `updater-signing` environment, and waits for the maintainer to read and publish it. The installers themselves are unsigned until a code-signing certificate exists (D19). Drafting runs `node scripts/gate.mjs publish` first, so nothing is drafted while `config/product.toml` holds a placeholder.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Build against the oldest glibc the package check runs on.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The system packages the desktop crate links against, as CI installs them (D55).
      - name: Install system packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh scripts/ci/linux-packages.txt ~/apt-packages

      - name: Install Rust
        run: rustup toolchain install

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pinned Inno Setup, checked against its SHA-256 (D106).
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup does not match its pinned SHA-256.' }
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait

      # Runs `gate.mjs release-build` first, then builds the app, the bridge and the installers.
      - name: Build the installers
        run: node scripts/build.mjs app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/packages/*.exe
            target/packages/*.deb
            target/packages/*.rpm
            target/packages/*.AppImage
          if-no-files-found: error

  # Each Linux package of each architecture installed on a fresh system of its kind: its dependencies cover the app, the app starts and registers the bridge, and removal unregisters it (scripts/ci/linux-package-check.sh).
  linux-packages:
    name: Linux ${{ matrix.kind }} (${{ matrix.runner }})
    needs: desktop
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        kind: [deb, rpm, appimage]
        include:
          - kind: deb
            image: ubuntu:24.04
          - kind: rpm
            image: fedora:42
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-Linux-${{ runner.arch }}
          path: packages

      - name: Read the names the check needs
        id: names
        run: |
          echo "app=$(sed -n 's/^app = "\(.*\)"/\1/p' config/product.toml)" >> "$GITHUB_OUTPUT"
          echo "notices=$(sed -n 's/^notices = "\(.*\)"/\1/p' config/product.toml)" >> "$GITHUB_OUTPUT"

      - name: Check the package
        if: matrix.kind != 'appimage'
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
          APP: ${{ steps.names.outputs.app }}
          NOTICES: ${{ steps.names.outputs.notices }}
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE"
          bash scripts/ci/linux-package-check.sh "$KIND" packages/*."$KIND" "$APP" "$NOTICES"

      - name: Check the AppImage
        if: matrix.kind == 'appimage'
        env:
          APP: ${{ steps.names.outputs.app }}
          NOTICES: ${{ steps.names.outputs.notices }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth mesa-vulkan-drivers >/dev/null
          sudo bash scripts/ci/linux-package-check.sh appimage packages/*.AppImage "$APP" "$NOTICES"

  extension:
    name: Extension
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The product check formats the generated Rust it compares with rustfmt.
      - name: Install Rust
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs `gate.mjs release-build` first, then builds and zips the extension for both browsers.
      - name: Build the store packages
        run: node scripts/build.mjs extension

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: target/packages/*.zip
          if-no-files-found: error

  prepare:
    name: Check the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, linux-packages, extension]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      verification: ${{ steps.release.outputs.verification }}
      public_key: ${{ steps.release.outputs.public_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The product check formats the generated Rust it compares with rustfmt.
      - name: Install Rust
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No identity value may still be a placeholder (D29).
      - name: Check what is published
        run: node scripts/gate.mjs publish

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      # The repository, the tag and the exact installer set; in signed mode, the manifest for the signing job (D111).
      - name: Check the installers
        id: release
        run: node scripts/release/manifest.mjs release >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.verification == 'signed'
        with:
          name: update-manifest
          path: release/update.json
          if-no-files-found: error

  # UPDATER_PRIVATE_KEY is a secret of the protected updater-signing environment, so only this job can read it (D288). It installs no packages, and signs whatever `prepare` wrote.
  sign:
    name: Sign the update manifest
    if: needs.prepare.outputs.verification == 'signed'
    needs: prepare
    environment: updater-signing
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release/sign.mjs
            scripts/release/update-files.mjs
            scripts/release/updater-key.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-manifest
          path: update

      - name: Sign the manifest
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ needs.prepare.outputs.public_key }}
        run: node scripts/release/sign.mjs update

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-signature
          path: update/update.json.sig
          if-no-files-found: error

  draft:
    name: Draft the release
    needs: [prepare, sign]
    # A skipped signing job is right only in GitHub mode.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.sign.result == 'success' ||
      (needs.prepare.outputs.verification == 'github' && needs.sign.result == 'skipped'))
    concurrency:
      group: release-draft-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      # A tag with a pre-release part (`v1.2.3-beta.1`) drafts a pre-release, which the app offers only to those who ask for one. GitHub-mode builds trust the size and digest GitHub reports for each file (D288), so each must match the built file.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/view"); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is already published, so its files stay as they are."
              exit 1
            fi
          elif grep -q 'release not found' "$RUNNER_TEMP/view"; then
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
          else
            cat "$RUNNER_TEMP/view" >&2
            exit 1
          fi
          gh release upload "$TAG" --clobber release/*
          for file in release/*; do
            echo "$(basename "$file") $(stat -c %s "$file") sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
          done | sort > "$RUNNER_TEMP/built"
          # GitHub may report an upload's digest a moment after the upload.
          for _ in $(seq 10); do
            gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) \(.digest)"' | sort > "$RUNNER_TEMP/uploaded"
            if cmp -s "$RUNNER_TEMP/built" "$RUNNER_TEMP/uploaded"; then exit 0; fi
            grep -q ' null$' "$RUNNER_TEMP/uploaded" || break
            sleep 3
          done
          echo "::error::The draft's files are not the built ones."
          diff -u "$RUNNER_TEMP/built" "$RUNNER_TEMP/uploaded"
          exit 1
