# Builds what a release ships and drafts the GitHub release with it (XC-20). A version tag (`v1.2.3`) starts it, or a run by hand, which builds without drafting. The installers are unsigned until the code-signing certificate and the updater key exist (D19); the draft waits for the maintainer to read and publish it. Drafting runs `node scripts/gate.mjs publish` first, so nothing is drafted while `config/product.toml` holds a placeholder.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The system packages the desktop crate links against, as CI installs them (D55).
      - name: Install system packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh scripts/ci/linux-packages.txt ~/apt-packages

      - name: Install Rust
        run: rustup toolchain install

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pinned Inno Setup, checked against its SHA-256 (D106).
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup does not match its pinned SHA-256.' }
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait

      # Runs `gate.mjs release-build` first, then builds the app, the bridge and the installers.
      - name: Build the installers
        run: node scripts/package.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            target/packages/*.exe
            target/packages/*.deb
            target/packages/*.rpm
            target/packages/*.AppImage
          if-no-files-found: error

  extension:
    name: Extension
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The product check formats the generated Rust it compares with rustfmt.
      - name: Install Rust
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # What a store upload needs on top of the release checks: the bundled Public Suffix List is current.
      - name: Check the extension release
        run: node scripts/gate.mjs release-build-extension

      - name: Build the store packages
        run: pnpm --filter @wirecatch/extension zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: apps/extension/.output/*.zip
          # WXT writes the packages to `.output`, which the action skips as hidden unless told.
          include-hidden-files: true
          if-no-files-found: error

  draft:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, extension]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The product check formats the generated Rust it compares with rustfmt.
      - name: Install Rust
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No identity value may still be a placeholder (D29).
      - name: Check what is published
        run: node scripts/gate.mjs publish

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes release/*/*
