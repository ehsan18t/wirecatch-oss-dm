# Builds the release assets (D111). A version tag push also prepares a draft for the maintainer to publish. Only signed update mode needs UPDATER_PRIVATE_KEY.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Build against the oldest glibc the package check runs on.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The system packages the desktop crate links against, as CI installs them (D55).
      - name: Install system packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh scripts/ci/linux-packages.txt ~/apt-packages

      - name: Install Rust
        run: rustup toolchain install

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pinned Inno Setup, checked against its SHA-256 (D106).
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup does not match its pinned SHA-256.' }
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait

      # Runs `gate.mjs release-build` first, then builds the app, the bridge and the installers.
      - name: Build the installers
        run: node scripts/package.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/packages/*.exe
            target/packages/*.deb
            target/packages/*.rpm
            target/packages/*.AppImage
          if-no-files-found: error

  # Each Linux package of each architecture installed on a fresh system of its kind: its dependencies cover the app, the app starts and registers the bridge, and removal unregisters it (scripts/ci/linux-package-check.sh).
  linux-packages:
    name: Linux ${{ matrix.kind }} (${{ matrix.runner }})
    needs: desktop
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        kind: [deb, rpm, appimage]
        include:
          - kind: deb
            image: ubuntu:24.04
          - kind: rpm
            image: fedora:42
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-Linux-${{ runner.arch }}
          path: packages

      - name: Read the names the check needs
        id: names
        run: |
          echo "app=$(sed -n 's/^app = "\(.*\)"/\1/p' config/product.toml)" >> "$GITHUB_OUTPUT"
          echo "notices=$(sed -n 's/^notices = "\(.*\)"/\1/p' config/product.toml)" >> "$GITHUB_OUTPUT"

      - name: Check the package
        if: matrix.kind != 'appimage'
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }}
          bash scripts/ci/linux-package-check.sh ${{ matrix.kind }} packages/*.${{ matrix.kind }} ${{ steps.names.outputs.app }} ${{ steps.names.outputs.notices }}

      - name: Check the AppImage
        if: matrix.kind == 'appimage'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth mesa-vulkan-drivers >/dev/null
          sudo bash scripts/ci/linux-package-check.sh appimage packages/*.AppImage ${{ steps.names.outputs.app }} ${{ steps.names.outputs.notices }}

  extension:
    name: Extension
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The product check formats the generated Rust it compares with rustfmt.
      - name: Install Rust
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the extension release
        run: node scripts/gate.mjs release-build

      - name: Build the browser extension archives
        run: pnpm --filter @wirecatch/extension zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: apps/extension/.output/*.zip
          # WXT writes the packages to `.output`, which the action skips as hidden unless told.
          include-hidden-files: true
          if-no-files-found: error

  prepare:
    name: Validate release inputs
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, linux-packages, extension]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      verification: ${{ steps.release.outputs.verification }}
      public_key: ${{ steps.release.outputs.public_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The product check formats the generated Rust it compares with rustfmt.
      - name: Install Rust
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check what is published
        run: node scripts/gate.mjs publish

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Check the repository, tag and installer set
        id: release
        run: node scripts/release/manifest.mjs release release-manifest.json >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inventory
          path: release-manifest.json
          if-no-files-found: error

  sign:
    name: Sign the update manifest
    if: needs.prepare.outputs.verification == 'signed'
    needs: prepare
    environment: updater-signing
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release/sign.mjs
            scripts/release/update-files.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inventory

      - name: Sign and verify the prepared manifest
        env:
          UPDATER_PUBLIC_KEY: ${{ needs.prepare.outputs.public_key }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: node scripts/release/sign.mjs release-manifest.json signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-update
          path: signed/
          if-no-files-found: error

  draft:
    name: Draft and verify the release
    concurrency:
      group: release-draft-${{ github.ref }}
      cancel-in-progress: false
    needs: [prepare, sign]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.sign.result == 'success' ||
      (needs.prepare.outputs.verification == 'github' && needs.sign.result == 'skipped'))
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inventory

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.verification == 'signed'
        with:
          name: signed-update
          path: release

      - name: Draft and verify the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFICATION: ${{ needs.prepare.outputs.verification }}
        run: node scripts/release/draft.mjs release-manifest.json release "$VERIFICATION" "$(git rev-parse HEAD)"
