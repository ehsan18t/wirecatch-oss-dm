# Weekly report of outdated dependencies, written to the run's summary by scripts/outdated.mjs. It opens no pull requests or issues: the maintainer reads the report and updates on purpose (D28). An outdated dependency is not a failure; the run fails only when part of the report could not be produced.
name: Outdated dependencies

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  report:
    name: Outdated dependencies
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the release named in rust-toolchain.toml, whose cargo resolves the lockfile.
      - name: Install Rust
        run: rustup toolchain install

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # pnpm outdated compares the installed versions with the registry.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report outdated dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/outdated.mjs
