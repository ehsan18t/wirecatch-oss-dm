# Weekly measurement of the desktop list at 10,000 downloads (`pnpm e2e:perf`), written to the run's summary. Its frame-time limits need a quiet machine, which a shared runner does not promise, so it reports rather than gating pull requests (XC-18, DUI-18); a failed run means the list got slower, or the runner was busy, and is read, not retried.
name: Performance

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  list:
    name: List at 10,000 downloads
    timeout-minutes: 20
    # Edge comes with the Windows runner, as with the browser checks.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure
        run: pnpm --filter @wirecatch/desktop e2e:perf

      - name: Write the measurements to the summary
        if: always()
        shell: bash
        run: |
          results=apps/desktop/test-results/performance.json
          if [ -f "$results" ]; then
            { echo '### List at 10,000 downloads'; echo '```json'; cat "$results"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No measurements were written.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance
          path: apps/desktop/test-results
          retention-days: 90
          if-no-files-found: ignore
