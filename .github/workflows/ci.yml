# Runs the quality gate (scripts/gate.mjs) on Windows and Ubuntu. The gate script holds every command; this file only decides where each check runs.
# Actions are pinned to commit SHAs; the version each SHA belongs to is in the comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The oldest Rust the published engine crate promises to build with (rust-version in Cargo.toml).
  RUST_MSRV: "1.88.0"
  NODE_VERSION: "22"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The desktop crate (Tauri 2) links against WebKitGTK and friends on Linux. Windows runners already have WebView2.
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # The streams crate's join tests need a real ffmpeg; they skip without one, so Linux CI is where the real stream-copy join is proven.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo "WIRECATCH_TEST_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "WIRECATCH_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Installs the release named in rust-toolchain.toml, with rustfmt and clippy.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Gate (Rust)
        run: node scripts/gate.mjs rust

      # The engine is published to crates.io, and its http3 feature is off by default: check both once per run.
      - name: Gate (engine release checks)
        if: runner.os == 'Linux'
        run: node scripts/gate.mjs release clippy-http3

  msrv:
    name: Engine on its minimum Rust version
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: cargo +${{ env.RUST_MSRV }} check -p wirecatch-engine --locked

  # Supply chain: known advisories (Rust and npm), licenses compatible with GPL-3.0-only, banned or duplicated crates, crate sources and unused dependencies. The policy is in deny.toml and package.json (pnpm.auditConfig).
  supply-chain:
    name: Supply chain
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      # Also keeps the installed tools between runs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pinned, and built from their own lockfiles, like every other tool here.
      - name: Install cargo-deny and cargo-machete
        run: |
          cargo install cargo-deny --version 0.19.0 --locked
          cargo install cargo-machete --version 0.9.2 --locked

      - name: Gate (supply chain)
        run: node scripts/gate.mjs supply-chain

  js:
    name: JavaScript (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `pnpm protocol:generate` runs the wirecatch-protocol tests to export the types.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate (JavaScript and repository rules)
        run: node scripts/gate.mjs js repo

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gate (commit messages)
        env:
          GATE_COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node scripts/gate.mjs commits
