# Every D18 check (docs/DECISIONS.md) on Windows and Ubuntu.
# Actions are pinned to commit SHAs; the version each SHA belongs to is in the comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pinned so a new Rust release cannot turn the build red on its own (new lints).
  # Raise it on purpose, together with any fixes it needs.
  RUST_TOOLCHAIN: "1.99.0"
  # The oldest Rust the published engine crate promises to build with
  # (rust-version in Cargo.toml).
  RUST_MSRV: "1.88.0"
  NODE_VERSION: "22"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The desktop crate (Tauri 2) links against WebKitGTK and friends on Linux.
      # Windows runners already have WebView2.
      - name: Install Tauri system packages
        if: runner.os == 'Linux' && hashFiles('apps/desktop/src-tauri/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # The streams crate's join tests need a real ffmpeg; they skip without one,
      # so Linux CI is where the real stream-copy join is proven.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo "WIRECATCH_TEST_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "WIRECATCH_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"

      # tauri::generate_context! embeds the built frontend at compile time and
      # fails if its folder is missing. Clippy and the tests do not need the real
      # frontend, so an empty folder at the configured path is enough here; the
      # JavaScript job builds the real one.
      - name: Create the desktop frontend folder
        if: hashFiles('apps/desktop/src-tauri/tauri.conf.json') != ''
        shell: bash
        run: |
          dist="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').build.frontendDist")"
          mkdir -p "apps/desktop/src-tauri/$dist"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # test-overrides only exists for the bridge's end-to-end tests; it is
      # never enabled in a build.
      # The desktop crate is tested on its own: its Tauri build script adds link
      # paths that break other crates' doctests when everything links together.
      - name: Tests
        run: cargo test --workspace --exclude wirecatch-desktop --locked --features wirecatch-bridge/test-overrides

      - name: Desktop tests
        run: cargo test -p wirecatch-desktop --locked

      # The engine is published to crates.io: its docs must build cleanly and
      # the package must verify. Once per run is enough.
      - name: Engine docs
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p wirecatch-engine --no-deps --locked

      - name: Engine package
        if: runner.os == 'Linux'
        run: cargo package -p wirecatch-engine --locked

  msrv:
    name: Engine on its minimum Rust version
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: cargo +${{ env.RUST_MSRV }} check -p wirecatch-engine --locked

  js:
    name: JavaScript (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `pnpm protocol:generate` runs the wirecatch-protocol tests to export the types.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Install dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      # Until the first package with dependencies commits pnpm-lock.yaml.
      - name: Install dependencies (no lockfile yet)
        if: hashFiles('pnpm-lock.yaml') == ''
        run: pnpm install --no-frozen-lockfile

      - name: Regenerate protocol types
        run: pnpm protocol:generate

      - name: Generated types are committed and up to date
        shell: bash
        run: |
          changes="$(git status --porcelain -- packages/protocol/src)"
          if [ -n "$changes" ]; then
            echo "::error::The TypeScript protocol types are stale. Run 'pnpm protocol:generate' and commit the result."
            echo "$changes"
            git --no-pager diff -- packages/protocol/src
            exit 1
          fi

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
