# Runs the quality gate (scripts/gate.mjs) on Windows and Ubuntu. Every check and every tool version lives in the gate script; this file installs what a runner lacks and decides where each group runs. Together the jobs run what `pnpm gate --no-desktop` runs: on this branch the Tauri app is left out (D100).
# Actions are pinned to commit SHAs; the version each SHA belongs to is in the comment.
name: CI

on:
  push:
    branches: [main, gpui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line numbers in backtraces without full debug info, which is most of what linking costs on Windows.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The oldest Node that "engines" in package.json allows, which every job runs.
  NODE_VERSION: "22"
  # The Node developers run, which the JavaScript job also runs on one system: runtimes differ in what their URL parser accepts (D68).
  NODE_NEWEST: "24"
  # The first part of every Rust cache key. Raise it when a build setting changes what the caches hold so much that restoring an older one costs more than it saves.
  CACHE_PREFIX: v1-rust
  # Free disk below which a Rust job warns: the dependency tree grows, and a link that runs out of disk fails with a bus error rather than a clear message.
  DISK_WARNING_GIB: "4"

# Every job has a time limit well above its slowest healthy run, so a stall fails in minutes instead of holding a run for an hour (D57). Rust's leaves room for a build from an empty cache, which every new stable Rust release brings.
jobs:
  rust:
    name: Rust ${{ matrix.part }} (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The gate's two halves of the Rust group, side by side: each builds what it needs, so neither waits on the other.
        part: [lint, test]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The system packages the desktop crate links against (scripts/ci/linux-packages.txt): from the cache when this runner image installed them before, otherwise from the fastest Ubuntu mirror, with a deadline on every mirror (D55).
      - name: Read the runner image
        id: image
        if: runner.os == 'Linux'
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore system packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-packages
          key: apt-${{ steps.image.outputs.id }}-${{ hashFiles('scripts/ci/linux-packages.*') }}

      - name: Install system packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/linux-packages.sh scripts/ci/linux-packages.txt ~/apt-packages

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Installs the release named in rust-toolchain.toml, with rustfmt and clippy.
      - name: Install Rust
        run: rustup toolchain install

      # One cache per half, since a lint build holds metadata and a test build machine code. Saved on main and on the gpui integration branch (D99), also when a check fails, so one failing test does not throw away the dependency builds. Pull requests restore their base branch's caches.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ env.CACHE_PREFIX }}
          key: ${{ matrix.part }}
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gpui' }}

      # The streams and media tests need a real ffmpeg; they skip without one, so Linux CI is where real joins and conversions are proven. It is the build the media add-on installs, from the add-on's pinned address and checked against its pinned SHA-256 (`crates/addons/src/manifest.rs`, printed by the ffmpeg_release example), and the cache keeps it until that file changes.
      - name: Restore ffmpeg
        id: ffmpeg
        if: runner.os == 'Linux' && matrix.part == 'test'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('crates/addons/src/manifest.rs') }}

      - name: Download ffmpeg
        if: runner.os == 'Linux' && matrix.part == 'test' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          release=$(cargo run --quiet --locked -p wirecatch-core --example ffmpeg_release)
          read -r url sha256 program <<< "$release"
          curl --fail --location --retry 3 --silent --show-error --output "$RUNNER_TEMP/ffmpeg.tar.xz" "$url"
          echo "$sha256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum --check --strict
          mkdir -p ~/ffmpeg
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C ~/ffmpeg
          echo "$program" > ~/ffmpeg/program

      - name: Use ffmpeg
        if: runner.os == 'Linux' && matrix.part == 'test'
        run: |
          ffmpeg="$HOME/ffmpeg/$(cat ~/ffmpeg/program)"
          "$ffmpeg" -hide_banner -version | head -n 1
          echo "WIRECATCH_TEST_FFMPEG=$ffmpeg" >> "$GITHUB_ENV"
          echo "WIRECATCH_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"

      # Every test binary runs even after one fails, so one failure cannot hide what the others would show. The Tauri app no longer changes on this branch, so it is left out (D100).
      - name: Gate (Rust ${{ matrix.part }})
        run: node scripts/gate.mjs rust-${{ matrix.part }} --no-fail-fast --no-desktop

      # The published engine: its package and its minimum Rust version. Once per run is enough; its http3 feature is checked in the Rust group, on every system.
      - name: Gate (engine release checks)
        if: runner.os == 'Linux' && matrix.part == 'lint'
        run: node scripts/gate.mjs release

      - name: Disk margin
        if: always()
        shell: bash
        run: |
          df -h .
          free_gib=$(df -k . | awk 'NR == 2 { print int($4 / 1048576) }')
          if [ "$free_gib" -lt "$DISK_WARNING_GIB" ]; then
            echo "::warning::Only ${free_gib} GiB of disk left after the Rust checks (warning below ${DISK_WARNING_GIB} GiB). Free more of the runner or shrink the build before it runs out."
          fi

  supply-chain:
    name: Supply chain
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      # The crate registry cargo-deny reads the dependency graph from; nothing is built here.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ env.CACHE_PREFIX }}
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gpui' }}

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # cargo-deny and cargo-machete at the versions in scripts/gate/rust.mjs, as prebuilt release binaries whose checksums the action verifies (D33).
      - name: Read the gate tool versions
        id: tools
        run: echo "specs=$(node scripts/gate.mjs --tool-specs)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: ${{ steps.tools.outputs.specs }}
          fallback: none

      - name: Gate (supply chain)
        run: node scripts/gate.mjs supply-chain

  js:
    name: JavaScript (${{ matrix.os }}, ${{ matrix.node }} Node)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [oldest]
        include:
          - os: ubuntu-latest
            node: newest
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history, so the commit check can compare against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `pnpm protocol:generate` runs the wirecatch-protocol tests to export the types, and the Tauri version check reads Cargo.lock through cargo. Both run on Linux only, where they answer the same as anywhere, so Windows needs no Rust here.
      - name: Install Rust
        if: runner.os == 'Linux'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.os == 'Linux'
        with:
          prefix-key: ${{ env.CACHE_PREFIX }}
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gpui' }}

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node == 'newest' && env.NODE_NEWEST || env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate (JavaScript)
        run: node scripts/gate.mjs js --no-desktop ${{ runner.os != 'Linux' && '--skip=protocol' || '' }}

      # The commits the commit check covers: a pull request's own, or the ones a push brought. A new branch or a manual run has no earlier commit to compare with, so it checks against main. After a force push the earlier commit is in no branch, so it is fetched by its hash; when GitHub no longer has it, only the newest commit is checked.
      - name: Choose the commits to check
        if: runner.os == 'Linux' && matrix.node == 'oldest'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --quiet --no-tags origin "$BEFORE"; then
              range="$BEFORE..$GITHUB_SHA"
            else
              range="$GITHUB_SHA~1..$GITHUB_SHA"
            fi
          else
            range="origin/main..$GITHUB_SHA"
          fi
          echo "GATE_COMMIT_RANGE=$range" >> "$GITHUB_ENV"

      # The repository rules read files, manifests and commits, and answer the same on every system, so they run once.
      - name: Gate (repository rules)
        if: runner.os == 'Linux' && matrix.node == 'oldest'
        run: node scripts/gate.mjs repo --no-desktop

  # The checks in a real browser, alongside the JavaScript job: they take minutes and need no Rust. They run on both systems because each lays text out in its own fonts.
  browser:
    name: Browser (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The checks skip only where their browser is not installed. Both runners have Edge, so a skip here would hide a broken check: it fails instead.
      - name: Gate (browser)
        env:
          WIRECATCH_REQUIRE_BROWSER: "1"
        run: node scripts/gate.mjs browser --no-desktop

      # What a failed browser test saw: Playwright's snapshot of the page and its error context, for a failure that does not happen locally.
      - name: Keep the failed browser tests' results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.os }}
          path: apps/extension/test-results
          retention-days: 14
          if-no-files-found: ignore
