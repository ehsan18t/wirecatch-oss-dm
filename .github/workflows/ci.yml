# Runs the quality gate (scripts/gate.mjs) on Windows and Ubuntu. Every check and every tool version lives in the gate script; this file installs what a runner lacks and decides where each group runs. Together the jobs run exactly what `pnpm gate` runs.
# Actions are pinned to commit SHAs; the version each SHA belongs to is in the comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NODE_VERSION: "22"
  # The first part of every Rust cache key. Raise it when a build setting changes what the caches hold so much that restoring an older one costs more than it saves.
  CACHE_PREFIX: v1-rust
  # Free disk below which a Rust job warns: the dependency tree grows, and a link that runs out of disk fails with a bus error rather than a clear message.
  DISK_WARNING_GIB: "4"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Ubuntu image comes with toolchains this job never uses (Android, .NET, Haskell, CodeQL); without removing them the Rust build does not fit on the runner's disk.
      - name: Free runner disk
        if: runner.os == 'Linux'
        run: |
          df -h /
          time sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # The desktop crate (Tauri 2) links against WebKitGTK and friends on Linux; Windows runners already have WebView2. The streams crate's join tests need a real ffmpeg; they skip without one, so Linux CI is where the real stream-copy join is proven.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg
          echo "WIRECATCH_TEST_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "WIRECATCH_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Installs the release named in rust-toolchain.toml, with rustfmt and clippy.
      - name: Install Rust
        run: rustup toolchain install

      # Saved on main only, also when a check fails, so one failing test does not throw away the dependency builds. Pull requests restore main's caches.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ env.CACHE_PREFIX }}
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Every test binary runs even after one fails, so one failure cannot hide what the others would show.
      - name: Gate (Rust)
        run: node scripts/gate.mjs rust --no-fail-fast

      # The published engine: its package and its minimum Rust version. Once per run is enough; its http3 feature is checked in the Rust group, on every system.
      - name: Gate (engine release checks)
        if: runner.os == 'Linux'
        run: node scripts/gate.mjs release

      - name: Disk margin
        if: always()
        shell: bash
        run: |
          df -h .
          free_gib=$(df -k . | awk 'NR == 2 { print int($4 / 1048576) }')
          if [ "$free_gib" -lt "$DISK_WARNING_GIB" ]; then
            echo "::warning::Only ${free_gib} GiB of disk left after the Rust checks (warning below ${DISK_WARNING_GIB} GiB). Free more of the runner or shrink the build before it runs out."
          fi

  supply-chain:
    name: Supply chain
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      # The crate registry cargo-deny reads the dependency graph from; nothing is built here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ env.CACHE_PREFIX }}
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # cargo-deny and cargo-machete at the versions in scripts/gate/rust.mjs, as prebuilt release binaries whose checksums the action verifies (D33).
      - name: Read the gate tool versions
        id: tools
        run: echo "specs=$(node scripts/gate.mjs --tool-specs)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: ${{ steps.tools.outputs.specs }}
          fallback: none

      - name: Gate (supply chain)
        run: node scripts/gate.mjs supply-chain

  js:
    name: JavaScript (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history, so the commit check can compare against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `pnpm protocol:generate` runs the wirecatch-protocol tests to export the types, and the Tauri version check reads Cargo.lock through cargo.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ env.CACHE_PREFIX }}
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate (JavaScript)
        run: node scripts/gate.mjs js

      # The commits the commit check covers: a pull request's own, or the ones a push brought. A new branch or a manual run has no earlier commit to compare with, so it checks against main. After a force push the earlier commit is in no branch, so it is fetched by its hash; when GitHub no longer has it, only the newest commit is checked.
      - name: Choose the commits to check
        if: runner.os == 'Linux'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --quiet --no-tags origin "$BEFORE"; then
              range="$BEFORE..$GITHUB_SHA"
            else
              range="$GITHUB_SHA~1..$GITHUB_SHA"
            fi
          else
            range="origin/main..$GITHUB_SHA"
          fi
          echo "GATE_COMMIT_RANGE=$range" >> "$GITHUB_ENV"

      # The repository rules read files, manifests and commits, and answer the same on every system, so they run once.
      - name: Gate (repository rules)
        if: runner.os == 'Linux'
        run: node scripts/gate.mjs repo

  # The checks in a real browser, alongside the JavaScript job: they take minutes and need no Rust. They run on both systems because each lays text out in its own fonts.
  browser:
    name: Browser (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The checks skip only where their browser is not installed. Both runners have Edge, so a skip here would hide a broken check: it fails instead.
      - name: Gate (browser)
        env:
          WIRECATCH_REQUIRE_BROWSER: "1"
        run: node scripts/gate.mjs browser
