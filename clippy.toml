# Tests may unwrap and print: a panic there is the failure report.
# The MSRV comes from each crate's `rust-version`, so it is not repeated here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true

# A blocked thread cannot be woken: a shutdown or a change waits out the whole sleep, and a test that sleeps is slow or flaky.
disallowed-methods = [
    { path = "std::thread::sleep", reason = "wait on the condition instead (a channel, a watch, `recv_timeout`), or use `tokio::time::sleep` in async code" },
]

# docs/ENGINEERING.md, section 4: a function past 80 lines is a signal to split.
too-many-lines-threshold = 80

# Product and format names that read as names in documentation, not as code. `..` keeps clippy's defaults.
doc-valid-idents = ["..", "WebM", "FairPlay", "PlayReady", "CloudFront", "ID3v2", "AppImage", "WebView2", "WebKitGTK", "OpenDocument", "YouTube", "OpenPGP"]
