[env]
# Where a plain `cargo test` writes the TypeScript types the protocol tests export: inside the ignored build folder, so test runs never touch the committed types. `pnpm protocol:generate` sets the variable itself (a set variable wins over this) and formats what it writes into packages/protocol/src/generated.
TS_RS_EXPORT_DIR = { value = "target/ts-rs", relative = true }

[build]
# Incremental caches roughly double the size of each build folder; disk is the tighter constraint here than rebuild time.
incremental = false

[alias]
# The desktop app with GPUI optimised; see `[profile.ui]` in Cargo.toml.
ui = "run -p wirecatch-desktop --profile ui"
